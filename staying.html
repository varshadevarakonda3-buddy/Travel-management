<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  background:#f3f4f6;
  min-height:100vh;
}

/* CONTAINER – CENTER SEARCH */
.container{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* SEARCH */
.search-box{
  background:white;
  padding:35px;
  border-radius:16px;
  box-shadow:0 15px 35px rgba(0,0,0,0.15);
  text-align:center;
  width:100%;
  max-width:650px;
}

.search-box h2{
  margin-bottom:16px;
}

.search-box input{
  width:70%;
  padding:14px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:15px;
}

.search-box button{
  padding:14px 30px;
  margin-left:10px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:15px;
}
.search-box button:hover{
  background:#1d4ed8;
}

/* INFO */
.info{
  margin-top:40px;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 15px 35px rgba(0,0,0,0.15);
  max-width:650px;
  width:100%;
  display:none;
  text-align:center;
}

.booking-buttons{
  margin-top:25px;
}

.booking-buttons a{
  display:inline-block;
  margin:10px;
  padding:14px 26px;
  border-radius:12px;
  text-decoration:none;
  color:white;
  font-weight:600;
}

.oyo{ background:#ee2e24; }
.booking{ background:#003580; }

/* FOOTER */
footer{
  text-align:center;
  padding:15px;
  color:#374151;
  margin-top:40px;
}
</style>
</head>

<body>

<div class="container">

  <!-- SEARCH BOX (CENTER) -->
  <div class="search-box">
    <h2>Enter Your Destination</h2>
    <input type="text" id="city" placeholder="Eg: Hyderabad, Delhi, Bangalore">
    <button onclick="searchStay()">Search Hotels</button>
  </div>

  <!-- INFO -->
  <div class="info" id="stayInfo">
    <h2>Hotels in <span id="cityName"></span></h2>
    <p>
      You will be redirected to trusted hotel booking platforms
      where you can select dates, rooms, and complete the booking.
    </p>

    <div class="booking-buttons">
      <a id="oyoLink" class="oyo" target="_blank">🏨 Book with OYO</a>
      <a id="bookingLink" class="booking" target="_blank">🏨 Book with Booking.com</a>
    </div>
  </div>

</div>

<footer>
  © 2026 Travel Management System
</footer>

<script>
function searchStay(){
  const city = document.getElementById("city").value.trim();
  if(city === ""){
    alert("Please enter a destination");
    return;
  }

  document.getElementById("cityName").innerText = city;

  document.getElementById("oyoLink").href =
    "https://www.oyorooms.com/search/?location=" + encodeURIComponent(city);

  document.getElementById("bookingLink").href =
    "https://www.booking.com/searchresults.html?ss=" + encodeURIComponent(city);

  document.getElementById("stayInfo").style.display = "block";
}
</script>

</body>
</html>

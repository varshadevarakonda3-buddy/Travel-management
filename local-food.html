<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Food | Travel Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#5b5fe9;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

/* ===== BACKGROUND SAME AS OTHER PAGES ===== */
body{
  height:100vh;
  background:url("Images/travel1.jpg") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

body::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.35);
}

/* ===== GLASS CARD ===== */
.app-container{
  width:85%;
  height:85%;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(14px);
  border-radius:30px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  padding:30px 40px;
  overflow:auto;
  color:#fff;
}

/* ===== HEADER ===== */
.header{
  text-align:center;
  margin-bottom:30px;
}

.header h2{
  font-size:26px;
}

.header p{
  font-size:14px;
  opacity:0.9;
}

/* ===== SEARCH BAR STYLE ===== */
.location-box{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:30px;
  max-width:600px;
  margin-left:auto;
  margin-right:auto;
}

.location-box input{
  flex:1;
  padding:12px 18px;
  border-radius:999px;
  border:none;
  outline:none;
}

.btn{
  padding:10px 26px;
  border:none;
  border-radius:999px;
  background:var(--primary);
  color:white;
  cursor:pointer;
}

/* ===== FOOD SECTION ===== */
.food-section{
  display:none;
  margin-top:30px;
}

.food-section h3{
  margin-bottom:20px;
}

/* ===== FOOD GRID ===== */
.food-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.food-card{
  background:white;
  padding:20px;
  border-radius:18px;
  color:#111827;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.food-card h4{
  margin-bottom:6px;
}

.food-card p{
  font-size:13px;
  color:#6b7280;
  margin-bottom:6px;
}

.price{
  font-size:13px;
  font-weight:600;
  color:#16a34a;
}
</style>
</head>

<body>
<a href="destination.html" class="back-btn">← Back</a>

<div class="app-container">

  <!-- HEADER -->
  <div class="header">
    <h2>Local Food Guide</h2>
    <p>Discover authentic local cuisine at your destination</p>
  </div>

  <!-- LOCATION INPUT -->
  <div class="location-box">
    <input type="text" id="location" placeholder="Enter destination (e.g., Hyderabad)">
    <button class="btn" onclick="loadFood()">View Local Food</button>
  </div>

  <!-- FOOD LIST -->
  <div class="food-section" id="foodSection">
    <h3>Popular Local Foods in <span id="cityName"></span></h3>
    <div class="food-list" id="foodList"></div>
  </div>

</div>

<script>
const foodData = {
  Hyderabad:[
    {name:"Hyderabadi Biryani",desc:"Aromatic rice dish with spices and meat",price:"₹250"},
    {name:"Haleem",desc:"Slow-cooked meat and lentil delicacy"},
    {name:"Irani Chai",desc:"Traditional tea with Osmania biscuit",price:"₹40"}
  ],
  Delhi:[
    {name:"Chole Bhature",desc:"Spicy chickpeas with fried bread",price:"₹120"},
    {name:"Butter Chicken",desc:"Creamy tomato-based chicken curry"},
    {name:"Paratha",desc:"Stuffed flatbread from Old Delhi"}
  ],
  Mumbai:[
    {name:"Vada Pav",desc:"Mumbai’s iconic street food",price:"₹30"},
    {name:"Pav Bhaji",desc:"Spicy vegetable curry with bread",price:"₹150"},
    {name:"Bhel Puri",desc:"Tangy puffed rice snack"}
  ]
};

function loadFood(){
  const city=document.getElementById("location").value.trim();
  if(!city){
    alert("Please enter a destination");
    return;
  }

  document.getElementById("cityName").innerText = city;
  const list=document.getElementById("foodList");
  list.innerHTML="";

  const foods = foodData[city] || [
    {name:"Local Special Dish",desc:"Popular regional food"},
    {name:"Street Food",desc:"Famous local snack",price:"₹80"},
    {name:"Traditional Sweet",desc:"Regional dessert"}
  ];

  foods.forEach(food=>{
    list.innerHTML += `
      <div class="food-card">
        <h4>${food.name}</h4>
        <p>${food.desc}</p>
        ${food.price ? `<div class="price">${food.price}</div>` : ``}
      </div>
    `;
  });

  document.getElementById("foodSection").style.display="block";
}
function goBack(){
  window.location.href="destination.html";
}
</script>

</body>
</html>

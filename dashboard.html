<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif;}
body{
  margin:0;
  min-height:100vh;
  background:url("images/travel1.jpg") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);
  padding:50px;
  width:440px;
  border-radius:18px;
  text-align:center;
}
.card h2{font-size:32px;margin-bottom:10px;}
.card p{color:#475569;margin-bottom:30px;}
.btn{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
.primary{background:#2563eb;color:white;}
.secondary{background:#e5e7eb;}
</style>
</head>

<body>
<div class="card">
  <h2>Welcome</h2>
  <p>Choose how you want to continue</p>
  <button class="btn primary" onclick="location.href='signup.html'">Create Account</button>
  <button class="btn secondary" onclick="location.href='login.html'">Login</button>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Attractions | Travel Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", Arial, sans-serif;
}

/* ===== BACKGROUND WITH BLUR (LOCAL IMAGE) ===== */
body{
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:url("Attraction.jpg"); /* LOCAL IMAGE */
  background-size:cover;
  background-position:center;
  filter:blur(10px);
  transform:scale(1.1);
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.6);
  z-index:-1;
}

/* ===== HEADER ===== */
header{
  background:linear-gradient(90deg,#2563eb,#9333ea);
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  font-size:28px;
}

/* ===== CONTAINER ===== */
.container{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
}

/* ===== SEARCH BOX ===== */
.search-box{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
}

.search-box input{
  width:60%;
  padding:12px;
  border-radius:8px;
  border:1px solid #d1d5db;
}

.search-box button{
  padding:12px 25px;
  margin-left:10px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.search-box button:hover{
  background:#1d4ed8;
}

/* ===== ATTRACTIONS ===== */
#attractions{
  margin-top:30px;
  display:none;
}

.attraction-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-top:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.card h3{
  margin-bottom:8px;
  color:#111827;
}

.card p{
  font-size:14px;
  color:#6b7280;
}

/* ===== LOCAL TRAVEL ===== */
.local-travel{
  margin-top:40px;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  display:none;
}

.local-travel h2{
  margin-bottom:10px;
}

.travel-links a{
  display:inline-block;
  margin:10px;
  padding:12px 20px;
  border-radius:10px;
  text-decoration:none;
  color:white;
  font-weight:500;
}

.rapido{ background:#FFBF00; }
.ola{ background:#16a34a; }
.uber{ background:#111827; }

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:15px;
  color:#374151;
  margin-top:40px;
}
</style>
</head>

<body>

<header>
  <h1>Local Attractions & Travel</h1>
  <p>Explore destinations across India</p>
</header>

<div class="container">

  <!-- DESTINATION INPUT -->
  <div class="search-box">
    <h2>Enter Your Destination</h2><br>
    <input type="text" id="destination" placeholder="Eg: Hyderabad, Delhi, Mumbai">
    <button onclick="showAttractions()">Search</button>
  </div>

  <!-- ATTRACTIONS -->
  <div id="attractions">
    <h2>Top Attractions in <span id="placeName"></span></h2>
    <div class="attraction-grid" id="placesList"></div>
  </div>

  <!-- LOCAL TRAVEL -->
  <div class="local-travel" id="localTravel">
    <h2>Local Travel Options</h2>
    <p>Book rides easily using popular apps</p>

    <div class="travel-links">
      <a href="https://rapido.bike" target="_blank" class="rapido">🚲 Rapido</a>
      <a href="https://www.olacabs.com" target="_blank" class="ola">🚕 Ola</a>
      <a href="https://www.uber.com/in/en/" target="_blank" class="uber">🚖 Uber</a>
    </div>
  </div>

</div>

<footer>
  © 2026 Travel Management System
</footer>

<script>
const data = {
  Hyderabad:[
    "Charminar","Golconda Fort","Hussain Sagar",
    "Birla Mandir","Ramoji Film City",
    "Salar Jung Museum","Chowmahalla Palace",
    "Lumbini Park","Necklace Road","Laad Bazaar"
  ],
  Delhi:[
    "Red Fort","India Gate","Qutub Minar",
    "Lotus Temple","Humayun's Tomb",
    "Akshardham","Jama Masjid",
    "Raj Ghat","Chandni Chowk","Connaught Place"
  ],
  Mumbai:[
    "Gateway of India","Marine Drive","Elephanta Caves",
    "Juhu Beach","Siddhivinayak Temple",
    "Haji Ali","Colaba Causeway",
    "Bandra-Worli Sea Link","Film City","Chor Bazaar"
  ]
};

function showAttractions(){
  const dest = document.getElementById("destination").value.trim();
  if(dest === ""){
    alert("Please enter a destination");
    return;
  }

  document.getElementById("placeName").innerText = dest;
  const list = document.getElementById("placesList");
  list.innerHTML = "";

  const places = data[dest] || [
    "Famous Place 1","Famous Place 2","Famous Place 3",
    "Famous Place 4","Famous Place 5",
    "Famous Place 6","Famous Place 7",
    "Famous Place 8","Famous Place 9","Famous Place 10"
  ];

  places.forEach(place=>{
    list.innerHTML += `
      <div class="card">
        <h3>${place}</h3>
        <p>A popular tourist attraction in ${dest}.</p>
      </div>
    `;
  });

  document.getElementById("attractions").style.display="block";
  document.getElementById("localTravel").style.display="block";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Attractions</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{ --primary:#5b5fe9; }

*{ margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI"; }

body{
  height:100vh;
  background:url("Images/travel1.jpg") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

body::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.35);
}

.app-container{
  width:85%;
  height:85%;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(14px);
  border-radius:30px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  padding:30px 40px;
  display:flex;
  flex-direction:column;
  overflow:auto;
}

.header{
  color:#fff;
}

.back-btn{
  margin-top:6px;
  font-size:14px;
  cursor:pointer;
}

.back-btn:hover{ text-decoration:underline; }

.search-box{
  margin-top:40px;
  align-self:center;
  background:white;
  padding:14px 18px;
  border-radius:999px;
  display:flex;
  gap:12px;
  width:420px;
}

.search-box input{
  border:none;
  outline:none;
  flex:1;
}

.search-box button{
  background:var(--primary);
  color:white;
  border:none;
  padding:8px 20px;
  border-radius:999px;
  cursor:pointer;
}

.destination-title{
  margin-top:25px;
  font-size:22px;
  color:#fff;
  text-align:center;
}

.attraction-grid{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:16px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<div class="app-container">

  <div class="header">
    <h2>Local Attractions</h2>
    <div class="back-btn" onclick="goBack()">← Back</div>
  </div>

  <div class="search-box">
    <input type="text" id="destination" placeholder="Enter Destination">
    <button onclick="showAttractions()">Search</button>
  </div>

  <div class="destination-title" id="placeName"></div>
  <div class="attraction-grid" id="placesList"></div>

</div>

<script>
const data={
  Hyderabad:["Charminar","Golconda Fort","Hussain Sagar","Birla Mandir","Ramoji Film City","Salar Jung Museum","Chowmahalla Palace","Lumbini Park","Necklace Road","Laad Bazaar"],
  Delhi:["Red Fort","India Gate","Qutub Minar","Lotus Temple","Humayun's Tomb","Akshardham","Jama Masjid","Raj Ghat","Chandni Chowk","Connaught Place"],
  Mumbai:["Gateway of India","Marine Drive","Elephanta Caves","Juhu Beach","Siddhivinayak Temple","Haji Ali","Colaba Causeway","Bandra Sea Link","Film City","Chor Bazaar"]
};

function showAttractions(){
  const dest=document.getElementById("destination").value.trim();
  if(!dest){ alert("Enter destination"); return; }

  document.getElementById("placeName").innerText="Top 10 Attractions in "+dest;
  const list=document.getElementById("placesList");
  list.innerHTML="";

  const places=data[dest]||["Famous Place 1","Famous Place 2","Famous Place 3","Famous Place 4","Famous Place 5","Famous Place 6","Famous Place 7","Famous Place 8","Famous Place 9","Famous Place 10"];

  places.forEach(place=>{
    list.innerHTML+=`
      <div class="card">
        <h3>${place}</h3>
        <p>Popular tourist attraction in ${dest}</p>
      </div>`;
  });
}

function goBack(){
  window.location.href="destination.html";
}
</script>

</body>
</html>

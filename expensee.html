<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Group Expense Settlement</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#4f46e5;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", system-ui, Arial, sans-serif;
}

body{
  min-height:100vh;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* MAIN CARD */
.app{
  width:820px;
  background:var(--card);
  border-radius:24px;
  box-shadow:0 30px 60px rgba(0,0,0,0.12);
  padding:32px;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.header h2{
  font-size:22px;
  color:var(--text);
}

.header p{
  font-size:13px;
  color:var(--muted);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

/* SECTION */
.section{
  background:#f9fafb;
  padding:20px;
  border-radius:16px;
}

.section h3{
  font-size:16px;
  margin-bottom:12px;
}

/* INPUTS */
input,select{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-bottom:10px;
  font-size:14px;
}

/* BUTTONS */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-size:14px;
  cursor:pointer;
}

.btn:hover{opacity:0.9}

/* MEMBERS */
.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:6px;
}

.tag{
  background:#eef2ff;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  color:var(--primary);
}

/* CHECKBOX LIST */
.checks{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.checks label{
  font-size:13px;
  background:#eef2ff;
  padding:6px 10px;
  border-radius:8px;
}

/* LIST */
.list{
  margin-top:10px;
  max-height:160px;
  overflow:auto;
}

.item{
  background:white;
  padding:10px 12px;
  border-radius:10px;
  margin-bottom:8px;
  font-size:13px;
  display:flex;
  justify-content:space-between;
}

/* SETTLEMENT */
.settlement{
  margin-top:24px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#f9fafb;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.amount{
  font-weight:600;
}

/* PAY BUTTONS */
.pay{
  display:flex;
  gap:6px;
}

.pay button{
  border:none;
  padding:8px 10px;
  border-radius:8px;
  color:white;
  font-size:12px;
  cursor:pointer;
}

.phonepe{background:#7c3aed;}
.paytm{background:#0284c7;}
.gpay{background:#16a34a;}

</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">💰</div>
    <div>
      <h2>Group Expense Settlement</h2>
      <p>Smart splitting based on participation</p>
    </div>
  </div>

  <div class="grid">

    <!-- MEMBERS -->
    <div class="section">
      <h3>Add Members</h3>
      <input type="text" id="memberInput" placeholder="Member name">
      <button class="btn" onclick="addMember()">Add Member</button>
      <div class="tags" id="memberList"></div>
    </div>

    <!-- EXPENSE -->
    <div class="section">
      <h3>Add Expense</h3>
      <input type="text" id="title" placeholder="Expense title">
      <select id="category">
        <option>Travel</option>
        <option>Food</option>
        <option>Shopping</option>
        <option>Local Transport</option>
      </select>
      <input type="number" id="amount" placeholder="Amount ₹">

      <div class="checks" id="participantList"></div>

      <button class="btn" onclick="addExpense()">Add Expense</button>

      <div class="list" id="expenses"></div>
    </div>

  </div>

  <!-- FINAL SETTLEMENT -->
  <div class="settlement">
    <h3>Final Settlement</h3>
    <div id="summary"></div>
  </div>

</div>

<script>
let members=[];
let expenses=[];

function addMember(){
  const name=document.getElementById("memberInput").value.trim();
  if(!name) return;
  members.push({name,total:0});
  document.getElementById("memberInput").value="";
  renderMembers();
}

function renderMembers(){
  const m=document.getElementById("memberList");
  const p=document.getElementById("participantList");
  m.innerHTML=""; p.innerHTML="";
  members.forEach((mem,i)=>{
    m.innerHTML+=`<div class="tag">${mem.name}</div>`;
    p.innerHTML+=`
      <label>
        <input type="checkbox" value="${i}"> ${mem.name}
      </label>`;
  });
}

function addExpense(){
  const title=document.getElementById("title").value;
  const amount=Number(document.getElementById("amount").value);
  const checked=[...document.querySelectorAll('#participantList input:checked')];

  if(!title||!amount||checked.length===0){
    alert("Fill all fields & select participants");
    return;
  }

  const share=amount/checked.length;
  checked.forEach(c=>{
    members[c.value].total+=share;
  });

  expenses.push({title,amount,people:checked.length});
  renderExpenses();
  renderSummary();
}

function renderExpenses(){
  const e=document.getElementById("expenses");
  e.innerHTML="";
  expenses.forEach(ex=>{
    e.innerHTML+=`
      <div class="item">
        <span>${ex.title}</span>
        <span>₹${ex.amount}</span>
      </div>`;
  });
}

function renderSummary(){
  const s=document.getElementById("summary");
  s.innerHTML="";
  members.forEach(m=>{
    if(m.total>0){
      s.innerHTML+=`
        <div class="row">
          <span class="amount">${m.name} – ₹${m.total.toFixed(0)}</span>
          <div class="pay">
            <button class="phonepe" onclick="pay('phonepe',${m.total})">PhonePe</button>
            <button class="paytm" onclick="pay('paytm',${m.total})">Paytm</button>
            <button class="gpay" onclick="pay('gpay',${m.total})">GPay</button>
          </div>
        </div>`;
    }
  });
}

function pay(app,amount){
  let url="";
  if(app==="phonepe") url=`https://www.phonepe.com/pay?amount=${Math.round(amount)}`;
  if(app==="paytm") url=`https://paytm.com/`;
  if(app==="gpay") url=`https://pay.google.com/`;
  window.open(url,"_blank");
}
</script>

</body>
</html>

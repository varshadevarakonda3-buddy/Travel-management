<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Travel Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  font-family: Inter, Arial, sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:url("images/travel1.jpg") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Glass card */
.auth-card{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);
  padding:42px;
  width:420px;
  border-radius:18px;
  box-shadow:0 25px 45px rgba(0,0,0,0.35);
}

/* Headings */
.auth-card h2{
  font-size:30px;
  margin-bottom:6px;
  color:#0f172a;
}

.auth-card p{
  font-size:14px;
  color:#475569;
  margin-bottom:26px;
}

/* Inputs */
input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #cbd5f5;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:#2563eb;
}

/* Buttons */
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

.login-btn{
  background:#2563eb;
  color:white;
  margin-top:6px;
}

.login-btn:hover{
  background:#1e40af;
}

.create-btn{
  background:#f1f5f9;
  color:#0f172a;
  margin-top:14px;
}

.create-btn:hover{
  background:#e2e8f0;
}

/* Links */
.link{
  text-align:center;
  margin-top:18px;
}

.link a{
  text-decoration:none;
  font-size:14px;
  color:#2563eb;
}
</style>
</head>

<body>

<div class="auth-card">
  <h2>Login</h2>
  <p>Access your travel dashboard</p>

  <input type="text" placeholder="Email or Username">
  <input type="password" placeholder="Password">

  <button class="btn login-btn">Login</button>

  <!-- 🔹 CREATE ACCOUNT OPTION -->
  <button class="btn create-btn" onclick="location.href='signup.html'">
    Create Account
  </button>

  <div class="link">
    <a href="forgot.html">Forgot password?</a>
  </div>
</div>

</body>
</html>
